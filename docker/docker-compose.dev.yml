# ==============================================================================
# docker-compose.dev.yml: Development environment with hot reload
# Usage: docker compose -f docker/docker-compose.dev.yml up
# Note: Reads credentials from .env file automatically
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Filterest Development (mounted source code + live reload)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: easelect-dev
    ports:
      - "8082:8082"    # Go backend
      - "5173:5173"    # Vite dev server
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_ADMIN_USER}
      - DB_PASSWORD=${DB_ADMIN_PASSWORD}
      - DB_NAME=${DB_NAME}
      - ENVIRONMENT_TYPE=dev
      - SESSION_KEY=${SESSION_KEY}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_MODEL=${OPENAI_API_MODEL:-}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-}
      - TUKISUU_PURCHASE_SECRET=${TUKISUU_PURCHASE_SECRET:-}
      - TUKISUU_BASE_URL=${TUKISUU_BASE_URL:-}
      - MCP_SERVICE_TOKEN=${MCP_SERVICE_TOKEN:-}
      - REGFETCH_WORKER_SERVICE_TOKEN=${REGFETCH_WORKER_SERVICE_TOKEN:-}
      - SANDBOX_MODE=${SANDBOX_MODE:-true}
      - REVOLUT_MERCHANT_API_SECRET_KEY=${REVOLUT_MERCHANT_API_SECRET_KEY:-}
      - REVOLUT_MERCHANT_API_PUBLIC_KEY=${REVOLUT_MERCHANT_API_PUBLIC_KEY:-}
      - REVOLUT_WEBHOOK_SECRET=${REVOLUT_WEBHOOK_SECRET:-}
      - PAYMENT_CALLBACK_SECRET=${PAYMENT_CALLBACK_SECRET:-}
      # Database role credentials (from .env)
      - DB_ADMIN_USER=${DB_ADMIN_USER}
      - DB_ADMIN_PASSWORD=${DB_ADMIN_PASSWORD}
      - DB_READONLY_USER=${DB_READONLY_USER}
      - DB_READONLY_PASSWORD=${DB_READONLY_PASSWORD}
      - DB_CONFIDENTIAL_USER=${DB_CONFIDENTIAL_USER}
      - DB_CONFIDENTIAL_PASSWORD=${DB_CONFIDENTIAL_PASSWORD}
      - DB_BASIC_USER=${DB_BASIC_USER}
      - DB_BASIC_PASSWORD=${DB_BASIC_PASSWORD}
      - DB_GUEST_USER=${DB_GUEST_USER}
      - DB_GUEST_PASSWORD=${DB_GUEST_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source code for live development
      - ..:/app
      # Exclude node_modules (use container's version)
      - /app/node_modules
      # Persist storage
      - ../storage:/app/storage
      - ../db_backups:/app/db_backups
    networks:
      - easelect-network
    command: sh -c "npm run dev & go run main.go"

  # ----------------------------------------------------------------------------
  # PostgreSQL Database with PostGIS + pgvector extensions
  # ----------------------------------------------------------------------------
  db:
    build:
      context: ..
      dockerfile: docker/Dockerfile.db
    image: easelect-postgres:pg16-postgis-pgvector
    container_name: easelect-db-dev
    environment:
      - POSTGRES_USER=${DB_ADMIN_USER}
      - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      # Pass role passwords for init script
      - DB_READONLY_PASSWORD=${DB_READONLY_PASSWORD}
      - DB_CONFIDENTIAL_PASSWORD=${DB_CONFIDENTIAL_PASSWORD}
      - DB_BASIC_PASSWORD=${DB_BASIC_PASSWORD}
      - DB_GUEST_PASSWORD=${DB_GUEST_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ../server_tools/db_init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"  # External 5433, internal 5432 (allows native PostgreSQL on 5432)
    networks:
      - easelect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  easelect-network:
    driver: bridge

volumes:
  postgres_data_dev:
